name: publish

# Publishes to PyPI when a GitHub release is published (trusted publishing: no token is stored).
# One-time setup in PyPI: Account settings → Publishing → add a pending publisher with
# owner "jannerpareja", repository "rabmv", workflow "publish.yml", environment "pypi".

on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
